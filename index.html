<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>札幌 超惑星遠征</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
:root{--snow:#F2F4F1;--card:#FFFFFF;--ink:#141B33;--ink-2:#55607A;--rule:#D5DAD4;--toho:#1C7CC0;--alert:#A9441C;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--snow:#0E1426;--card:#171F38;--ink:#E8ECF4;--ink-2:#A3ADC4;--rule:#2A3555;--toho:#4FA6E6;--alert:#F2956C;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--snow);color:var(--ink);font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
.sign{width:min(100%,380px);background:#FFFFFF;color:#14192B;border:1px solid var(--rule);border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(20,27,51,.12)}
.top{display:flex;align-items:center;gap:12px;padding:18px 18px 12px}
.no{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:5px solid var(--toho);display:grid;place-items:center;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:.85rem}
.nm{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:1.9rem;letter-spacing:.06em;line-height:1.05}
.kana{font-size:.78rem;color:#55607A;letter-spacing:.08em}
.band{background:var(--toho);color:#FFF;padding:7px 18px;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:.9rem;display:flex;justify-content:space-between}
form{padding:18px;display:flex;flex-direction:column;gap:10px}
label{font-size:.9rem;color:#55607A}
input[type=password]{font:inherit;font-size:1.1rem;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;width:100%;color:#14192B;background:#FFF}
input[type=password]:focus{outline:2px solid var(--toho);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;font-size:.86rem;color:#55607A}
button{font:inherit;font-weight:700;padding:11px;border:0;border-radius:8px;background:var(--toho);color:#FFF;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--alert);font-size:.86rem;min-height:1.2em}
</style>
</head>
<body>
<div class="sign">
  <div class="top"><span class="no">H09</span><div><div class="nm">豊水すすきの</div><div class="kana">ほうすいすすきの · 2026.11.14–16</div></div></div>
  <div class="band"><span>札幌 超惑星遠征</span><span>私人手冊</span></div>
  <form id="f">
    <label for="pw">輸入密碼打開手冊</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus>
    <div class="row"><input type="checkbox" id="keep"><label for="keep" style="margin:0">在這支手機記住密碼</label></div>
    <button type="submit" id="go">打開</button>
    <div class="err" id="err"></div>
  </form>
</div>
